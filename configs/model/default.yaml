# XGBoost candidate configurations and training parameters.
# ~12 fixed candidates spanning the 8-axis hyperparameter surface:
# n_estimators, learning_rate, max_depth, min_child_weight,
# subsample, colsample_bytree, reg_alpha, reg_lambda.

candidates:
