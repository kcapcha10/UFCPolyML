# Mismatch report pipeline configuration
gate:
  k: 2.0                              # magnitude-gate multiplier (D34)
  buckets:
    - id: "0.1-0.3"
      lower: 0.1
      upper: 0.3
    - id: "0.3-0.5"
      lower: 0.3
      upper: 0.5
    - id: "0.5-0.7"
      lower: 0.5
      upper: 0.7
    - id: "0.7-0.9"
      lower: 0.7
      upper: 0.9

sparse_history:
  min_prior_ufc_fights_threshold: 3   # D37: tag when either fighter has < 3 prior UFC bouts

due_diligence:
  model_name: "claude-sonnet-4-20250514"
  prompt_version: "v1"
  search_provider: "tavily"
  max_evidence_urls: 5
  timeout_seconds: 30
  enabled: true

post_signal_snapshots:
  offsets_hours: [1, 4, 24]           # D36: ~T+1h, T+4h, T+24h
  include_fight_time: true            # D36: also capture at event start
  max_retries: 2

staleness:
  capture_max_age_minutes: 30
  report_max_age_days: 14
