stages:
  # ── Scrape ───────────────────────────────────────────────────────────────────
  scrape_ufcstats:
    cmd: make scrape
    deps:
      - src/ufc_edge/data/ufcstats/
    outs:
      - data/raw/ufcstats.duckdb:
          cache: true
          persist: true
    desc: "Crawl ufcstats.com → DuckDB. TODO: wire real output path once stable."

  # ── Cross-check ──────────────────────────────────────────────────────────────
  # Kaggle cross-check intentionally dropped: Kaggle UFC sets are largely UFCStats
  # rescrapes, so they are not independent validation. `make validate` runs the
  # production self-consistency suite instead.
